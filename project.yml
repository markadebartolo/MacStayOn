name: MacStayOn
options:
  bundleIdPrefix: com.markdebartolo
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  # Keep Xcodeproj format compatible with GitHub Actions Xcode 15 runners
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QA3AY5HLGM
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  MacStayOn:
    type: application
    platform: macOS
    sources:
      - path: MacStayOn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markdebartolo.MacStayOn
        PRODUCT_NAME: MacStayOn
        INFOPLIST_FILE: MacStayOn/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.6"
        CURRENT_PROJECT_VERSION: "11"
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_EMIT_LOC_STRINGS: false
        SWIFT_OBJC_BRIDGING_HEADER: MacStayOn/MacStayOn-Bridging-Header.h
    entitlements:
      path: MacStayOn/MacStayOn.entitlements
