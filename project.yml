name: LidAwake
options:
  bundleIdPrefix: com.markdebartolo
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  LidAwake:
    type: application
    platform: macOS
    sources:
      - path: LidAwake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markdebartolo.LidAwake
        PRODUCT_NAME: LidAwake
        INFOPLIST_FILE: LidAwake/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_EMIT_LOC_STRINGS: false
    entitlements:
      path: LidAwake/LidAwake.entitlements
