name: Release

# Builds CI artifacts for smoke-testing. Does NOT upload MacStayOn-macos-arm64.zip
# to the GitHub Release — notarized zips are published locally via scripts/notarize.sh
# so an unsigned Actions build cannot clobber a stapled Developer ID release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag label for artifact naming only (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build MacStayOn.app
        run: ./scripts/build.sh
      - name: Zip app (CI artifact only — not the GitHub Release asset)
        run: |
          ditto -c -k --keepParent dist/MacStayOn.app MacStayOn-macos-arm64-ci.zip
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/MacStayOn.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/MacStayOn.app/Contents/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-ci
          path: MacStayOn-macos-arm64-ci.zip
          retention-days: 14

  # Intentionally no job that runs `gh release upload --clobber`.
  # Notarized releases are created on a signed Mac with ./scripts/notarize.sh + gh release create.
